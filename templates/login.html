{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
  <div class="col-md-5">
    <h3 class="mb-3">Desk login</h3>
    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label>Username</label>
        <input class="form-control" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="small text-muted mt-3">Review, Orders, and Positions require a logged-in user.</p>
  </div>
</div>
{% endblock %}
