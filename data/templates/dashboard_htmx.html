<!DOCTYPE html>
<html>
<head>
    <title>📊 50 Smart Moving Average Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    {% load humanize %}
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
        label { margin-right: 10px; }
    </style>
</head>
<body>
    <h2>📈 50 Smart Moving Average Real-Time Dashboard</h2>

    <form id="sma50-form" hx-get="{% url 'sma50-dashboard' %}" hx-target="#stock-table" hx-swap="innerHTML">
        <label>Min % Change:
            <input type="number" name="min_chg" step="0.1" />
        </label>
        <label>Max % Change:
            <input type="number" name="max_chg" step="0.1" />
        </label>
        <label>
            <input type="checkbox" name="today" value="1" /> Today only
        </label>
        <button type="submit">Apply Filters</button>
    </form>

    <div id="stock-table">
        {% include "_stock_table.html" %}
    </div>
</body>
</html>
